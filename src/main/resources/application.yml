spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/hibento}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        use_sql_comments: true
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          casdoor:
            client-id: ${CASDOOR_CLIENT_ID}
            client-secret: ${CASDOOR_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          casdoor:
            authorization-uri: ${CASDOOR_ISSUER_URI}/login/oauth/authorize
            token-uri: ${CASDOOR_ISSUER_URI}/api/login/oauth/access_token
            jwk-set-uri: ${CASDOOR_ISSUER_URI}/.well-known/jwks
            user-info-uri: ${CASDOOR_ISSUER_URI}/api/userinfo
            user-name-attribute: sub
  flyway:
    baseline-on-migrate: true
hibento:
  admins: ${HIBENTO_ADMINS}

