spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/hibento}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        use_sql_comments: true
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CASDOOR_ISSUER_URI}
          jwk-set-uri: ${CASDOOR_ISSUER_URI}/.well-known/jwks
  flyway:
    baseline-on-migrate: true
hibento:
  admins: ${HIBENTO_ADMINS}
  cors:
    allowed-origins: ${HIBENTO_CORS_ALLOWED_ORIGINS:http://localhost:5173}
